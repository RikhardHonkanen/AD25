; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = direct
board_build.embed_txtfiles = src/srvrcert.pem 
                             src/prvtkey.pem
; !<command> is a built-in feature of PlatformIO's configuration engine. The exclamation point handles executing the instruction as a blocking shell process.
build_flags = !openssl req -newkey rsa:2048 -nodes -keyout src/prvtkey.pem -x509 -days 3650 -out src/srvrcert.pem -subj "/O=YH Akademin/CN=localhost"
